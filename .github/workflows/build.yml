name: Build WiFi File Transfer 7
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Windows application
        shell: powershell
        run: |
          $msbuild = (Get-ChildItem "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" | Select-Object -First 1).FullName
          $path = & $msbuild -latest -products '*' -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          & $path Windows\WifiFileTransfer7.sln /p:Configuration=Release /p:Platform="Any CPU" /m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: WiFi-File-Transfer-7-Windows
          path: Windows/bin/Release/
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Android APK
        working-directory: Android
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: WiFi-File-Transfer-7-Android
          path: Android/app/build/outputs/apk/debug/*.apk
